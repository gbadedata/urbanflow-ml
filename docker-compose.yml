services:
  postgres:
    image: postgres:16-alpine
    container_name: urbanflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbanflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanflow}
      POSTGRES_DB: ${POSTGRES_DB:-urbanflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbanflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: urbanflow-api
    # Only started with `--profile api`, so `docker compose up -d` during
    # development brings up the database alone and leaves the API to run from
    # the working tree with reload.
    profiles: ["api"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-urbanflow}:${POSTGRES_PASSWORD:-urbanflow}@postgres:5432/${POSTGRES_DB:-urbanflow}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
