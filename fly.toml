# Fly.io deployment. Scale-to-zero keeps the running cost at nothing while the
# service is idle, at the price of a cold start on the first request after a
# quiet period. That trade is deliberate and is stated in the README.

app = "urbanflow-ml"
primary_region = "lhr"

[build]
  dockerfile = "docker/Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
