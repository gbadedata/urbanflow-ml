[project]
name = "urbanflow"
version = "0.1.0"
description = "Production taxi-demand forecasting and decision API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "holidays>=0.50",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    # DuckDB requires pytz to materialise TIMESTAMPTZ values as Python datetimes.
    "pytz>=2024.1",
    "joblib>=1.5.3",
]

[project.scripts]
urbanflow = "urbanflow.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection is expressed through call-valued defaults.
"src/urbanflow/serving/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: requires internet access (deselect with '-m \"not network\"')",
]
