name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -m "not network" --cov=urbanflow --cov-report=term-missing

  image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile copies models/, which is gitignored because model
      # artefacts do not belong in version control. A placeholder keeps this
      # honest: the job proves the image builds and the process starts, not
      # that it serves forecasts. Deployment builds from a tree with real
      # artefacts produced by `urbanflow train`.
      - name: Create placeholder model directory
        run: mkdir -p models && touch models/.gitkeep

      # The gha cache backend needs a buildx builder that supports cache
      # export; the runner's default "docker" driver does not, which made
      # every build fail with "Cache export is not supported".
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: urbanflow-ml:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container starts and reports liveness
        run: |
          docker run -d --name urbanflow-ci -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://none:none@127.0.0.1:5432/none \
            urbanflow-ml:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "liveness confirmed after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"
          docker logs urbanflow-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs urbanflow-ci || true
